<!DOCTYPE html>
<html lang="es">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">      //Estas 4 lineas son must en el head
    <title>Atributos</title>
    <meta name="description" content="Probando atributos.">
</head>


<body>
    <h1 id="encabezado" class="rojo">Encabezados</h1>
    <p class="rojo" style="background-color:aquamarine">
        Este párrafo será visible en el navegador
    </p>
    <p id="explicacion" hidden>
        Este párrafo no será visible en el navegador
    </p>
    <p contenteditable spellcheck="true" tabindex="2">
        Este párrafo tiene faltaz de ortografía y es editavle
    </p>
    <p lang="en" translate="no">
        This paragraph is written in English
    </p>
    <input type="text" tabindex="3">
    <input type="text" tabindex="1">
</body>


</html>
